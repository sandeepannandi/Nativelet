name: Android emulator smoke
on:
  workflow_dispatch:
  push:
    branches: [ci/android-emulator-smoke, "parity/**"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install showcase deps
        working-directory: apps/showcase
        run: npm ci
      - name: Prebuild native project
        working-directory: apps/showcase
        run: npx expo prebuild --platform android --no-install --clean
      - name: Build release APK (x86_64, bundled JS)
        working-directory: apps/showcase/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: apps/showcase/android/app/build/outputs/apk/release/*.apk
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run smoke on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: |
            bash scripts/android-smoke.sh apk/*.apk
            bash scripts/android-fog.sh
            bash scripts/android-pendulum.sh
            bash scripts/android-blackhole.sh
            bash scripts/android-coin.sh
            bash scripts/android-reveal.sh
            bash scripts/android-prism.sh
            bash scripts/android-hourglass.sh
            bash scripts/android-strings.sh
            bash scripts/android-range.sh
            bash scripts/android-wheel.sh
            bash scripts/android-timeline.sh
            bash scripts/android-gestures.sh
            bash scripts/android-core.sh
            bash scripts/android-slowmotion.sh
            bash scripts/android-rail-stress.sh
            bash scripts/android-rail-behavior.sh
            bash scripts/android-core2.sh
            bash scripts/android-flowfield.sh
            bash scripts/android-crumple.sh
            bash scripts/android-shatter.sh
            bash scripts/android-recorder.sh
            bash scripts/android-venom.sh
      - name: Fail closed on crash or missing evidence
        if: always()
        run: python3 scripts/check-android-results.py smoke-out --routes index,fold,genie,blossom,capsule,cards,carousel,chart,curl,glass,gooey,light,lens,morph,orbit,pinch,ripple,sort,swipe,toasts,mosaic,bubbles,flap,banner,fog,pendulum,blackhole,coin,reveal,prism,hourglass,strings,range,wheel,timeline,path,flowfield,recorder,venom --require-summary fog --require-summary pendulum --require-summary blackhole --require-summary coin --require-summary reveal --require-summary prism --require-summary hourglass --require-summary strings --require-summary range --require-summary wheel --require-summary gestures --require-summary core --require-summary slowmotion --require-summary railstress --require-summary railbehavior --require-summary core2 --require-summary timeline --require-summary flowfield --require-summary crumple --require-summary shatter --require-summary recorder --require-summary venom
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-results
          path: smoke-out
