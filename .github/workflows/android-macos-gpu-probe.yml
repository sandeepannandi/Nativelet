name: Android macOS GPU probe

# Isolated environment probe. Manual dispatch only. NOT a validation run:
# it records actual VM/graphics acceleration and app pipeline/context
# behavior on the Intel-macOS standard runner and changes no existing
# Linux jobs, assertions or validation gates.

on:
  workflow_dispatch:

concurrency:
  group: macos-gpu-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install showcase deps
        working-directory: apps/showcase
        run: npm ci
      - name: Prebuild native project
        working-directory: apps/showcase
        run: npx expo prebuild --platform android --no-install --clean
      - name: Build release APK (x86_64, bundled JS)
        working-directory: apps/showcase/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: apps/showcase/android/app/build/outputs/apk/release/*.apk

  probe:
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Install API 34 x86_64 system image
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'system-images;android-34;default;x86_64'
      - name: Probe with host GPU requested
        env:
          GPU_MODE: host
          OUT: probe-out
          APK: app-release.apk
        run: bash scripts/android-macos-gpu-probe.sh
      - name: Probe with swiftshader control
        env:
          GPU_MODE: swiftshader
          OUT: probe-out
          APK: app-release.apk
        run: bash scripts/android-macos-gpu-probe.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-gpu-probe-results
          path: probe-out
