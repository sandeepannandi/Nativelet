name: Glass Shatter bounded UI sampling checkpoint
on:
  workflow_dispatch:
  push:
    branches: ["diagnostics/glass-shatter"]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install showcase deps
        working-directory: apps/showcase
        run: npm ci
      - name: Prebuild native project
        working-directory: apps/showcase
        run: npx expo prebuild --platform android --no-install --clean
      - name: Configure diagnostic trace temp directory
        run: node scripts/prepare-shatter-profile.cjs
      - name: Build release APK (x86_64, bundled JS)
        working-directory: apps/showcase/android
        env:
          EXPO_PUBLIC_SHATTER_PROFILE: "1"
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: apps/showcase/android/app/build/outputs/apk/release/*.apk
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run smoke on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: |
            adb install -r apk/*.apk
            bash scripts/android-system-ready.sh
            bash scripts/android-shatter-profile.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shatter-isolated-diagnostics
          path: smoke-out
