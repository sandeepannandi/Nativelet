name: FTL physical-test APK build

# Build-only pipeline producing the app APK (arm64) and the instrumentation
# test APK used for Firebase Test Lab physical-device runs. No assertions or
# qualification here: this workflow produces binaries; physical evidence is
# collected on the device farm.

on:
  workflow_dispatch:
  push:
    branches:
      - gyro-repair-validation

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install showcase deps
        working-directory: apps/showcase
        run: npm ci
      - name: Prebuild native project
        working-directory: apps/showcase
        run: npx expo prebuild --platform android --no-install --clean
      - name: Install FTL instrumentation harness
        working-directory: apps/showcase/android
        run: |
          mkdir -p app/src/androidTest/java/com/anonymous/nativeletshowcase
          cp "$GITHUB_WORKSPACE/scripts/ftl/FtlGyroFlickTest.java" app/src/androidTest/java/com/anonymous/nativeletshowcase/
          if ! grep -q testInstrumentationRunner app/build.gradle; then
            sed -i 's/\(applicationId .*\)/\1\n        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"/' app/build.gradle
          fi
          cat >> app/build.gradle <<'EOF'

          dependencies {
              androidTestImplementation 'androidx.test.ext:junit:1.2.1'
              androidTestImplementation 'androidx.test:runner:1.6.2'
          }
          EOF
      - name: Build app APK + test APK (arm64)
        working-directory: apps/showcase/android
        run: |
          echo '=== androidTest wiring in app/build.gradle ==='
          grep -n 'testInstrumentationRunner\|androidTestImplementation' app/build.gradle || true
          echo '=== gradle assemble tasks mentioning Test ==='
          ./gradlew tasks --all --console=plain 2>/dev/null | grep -iE '^assemble.*test' || echo 'NO androidTest assemble tasks registered'
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
          TASKS=$(./gradlew tasks --all --console=plain 2>/dev/null | grep -oE 'assemble[A-Za-z]*AndroidTest' | sort -u)
          echo "androidTest assemble tasks: [$TASKS]"
          if echo "$TASKS" | grep -qx 'assembleReleaseAndroidTest'; then
            ./gradlew assembleReleaseAndroidTest -PreactNativeArchitectures=arm64-v8a --no-daemon
          else
            echo 'assembleReleaseAndroidTest missing; not building a mismatched debug test variant'; exit 3
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ftl-apks
          path: |
            apps/showcase/android/app/build/outputs/apk/release/app-release.apk
            apps/showcase/android/app/build/outputs/apk/androidTest/*/*.apk
          if-no-files-found: error
