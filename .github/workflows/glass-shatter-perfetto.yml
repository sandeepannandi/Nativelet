name: Glass Shatter one native system trace
on:
  push:
    branches: ["diagnostics/glass-shatter-perfetto"]
permissions:
  contents: read
  actions: read
jobs:
  native-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
          run-id: 40518617475
          github-token: ${{ github.token }}
          path: apk
      - name: Record exact reused APK checksum
        run: sha256sum apk/*.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: One bounded native capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: |
            adb install -r apk/*.apk
            bash scripts/android-system-ready.sh
            bash scripts/android-shatter-perfetto.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shatter-native-trace
          path: smoke-out
